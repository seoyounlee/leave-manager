<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 연차 확인 · 신청</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT:'#2563eb', dark:'#1d4ed8' } },
          animation: { 'fade-up': 'fadeUp .3s ease both' },
          keyframes: { fadeUp: { from:{ opacity:0, transform:'translateY(12px)' }, to:{ opacity:1, transform:'translateY(0)' } } }
        }
      }
    }
  </script>
  <style>
    #ringFill { transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .4s; }
    .blink-dot { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    table { border-collapse: separate; border-spacing: 0; }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: #f9fafb; }
    tbody tr td { border-bottom: 1px solid #f3f4f6; }
    tbody tr:last-child td { border-bottom: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-xl mx-auto px-4 py-8 pb-16 flex flex-col gap-5">

  <!-- 헤더 -->
  <div class="text-center">
    <h1 class="text-2xl font-bold text-gray-900">🌿 내 연차 확인 · 신청</h1>
    <p class="text-sm text-gray-400 mt-1">이름을 선택하면 잔여 연차를 확인하고 신청할 수 있어요.</p>
  </div>

  <!-- 직원 선택 (드롭다운) -->
  <div class="bg-white rounded-2xl shadow-sm p-5">
    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 block">직원 선택</label>
    <select id="empSelect" onchange="onSelectEmp()"
      class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-base bg-gray-50
             focus:outline-none focus:border-blue-500 focus:bg-white transition
             appearance-none cursor-pointer"
      style="background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22/></svg>'); background-repeat: no-repeat; background-position: right 12px center;">
      <option value="">-- 이름을 선택하세요 --</option>
    </select>
  </div>

  <!-- 잔여 연차 히어로 -->
  <div id="heroCard" style="display:none" class="animate-fade-up bg-gradient-to-br from-blue-900 via-blue-800 to-blue-600 rounded-2xl shadow-xl p-6 text-white overflow-hidden relative">
    <span class="absolute -top-10 -right-10 w-48 h-48 rounded-full bg-white/5 pointer-events-none"></span>
    <span class="absolute -bottom-8 -left-8 w-36 h-36 rounded-full bg-white/5 pointer-events-none"></span>

    <p class="text-sm text-blue-200 font-semibold text-center mb-5" id="heroName">—</p>

    <div class="flex justify-center mb-5">
      <div class="relative w-40 h-40">
        <svg viewBox="0 0 168 168" class="w-full h-full">
          <circle cx="84" cy="84" r="68" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/>
          <circle id="ringFill" cx="84" cy="84" r="68" fill="none"
            stroke="#4ade80" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="427.3" stroke-dashoffset="427.3"
            transform="rotate(-90 84 84)"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-5xl font-extrabold leading-none" id="ringDays">0</span>
          <span class="text-xs text-blue-200 mt-1">일 남음</span>
        </div>
      </div>
    </div>

    <p class="text-sm text-blue-100 text-center mb-1" id="heroSummary"></p>

    <div id="pendingBadge" style="display:none" class="flex justify-center mt-2">
      <span class="inline-flex items-center gap-2 bg-white/10 rounded-full px-4 py-1.5 text-xs">
        <span class="blink-dot w-2 h-2 rounded-full bg-yellow-300 flex-shrink-0"></span>
        <span id="pendingBadgeText"></span>
      </span>
    </div>

    <div class="grid grid-cols-3 gap-px mt-6 pt-5 border-t border-white/15">
      <div class="text-center">
        <p class="text-[11px] text-blue-300 mb-1">총 연차</p>
        <p class="text-xl font-bold text-blue-100" id="sTot">—</p>
      </div>
      <div class="text-center border-x border-white/15">
        <p class="text-[11px] text-blue-300 mb-1">승인 사용</p>
        <p class="text-xl font-bold text-red-300" id="sUsed">—</p>
      </div>
      <div class="text-center">
        <p class="text-[11px] text-blue-300 mb-1">잔여</p>
        <p class="text-xl font-bold text-green-300" id="sRem">—</p>
      </div>
    </div>
  </div>

  <!-- 달력 (항상 표시) -->
  <div id="calCard" class="bg-white rounded-2xl shadow-sm p-5">
    <div class="flex items-center justify-between mb-4">
      <button onclick="calPrev()" class="px-3 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm transition">&lt;</button>
      <p class="text-sm font-bold text-gray-700" id="calTitle">2026년 5월</p>
      <button onclick="calNext()" class="px-3 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm transition">&gt;</button>
    </div>
    <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div id="calGrid" class="grid grid-cols-7 gap-px"></div>
    <div class="flex flex-wrap gap-3 mt-3 text-[10px] text-gray-400">
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span>종일</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-400"></span>오전반차</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-400"></span>오후반차</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-teal-500"></span>시간차</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-pink-500"></span>지원대휴</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400 border border-yellow-500"></span>대기중</span>
    </div>
  </div>

  <!-- 연차 신청 폼 -->
  <div id="formCard" style="display:none" class="animate-fade-up bg-white rounded-2xl shadow-sm p-5">
    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">연차 신청</p>

    <div class="flex items-start gap-2.5 bg-blue-50 border border-blue-100 rounded-xl p-3.5 mb-5 text-sm text-blue-700">
      <span class="text-base flex-shrink-0">ℹ️</span>
      <span>신청 후 <strong>관리자가 승인</strong>해야 연차가 차감됩니다.</span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1.5">날짜</label>
        <input type="date" id="fDate" oninput="checkDateConflict()"
          class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
        <div id="dateWarn" style="display:none" class="mt-2 flex items-center gap-2 bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-xs text-red-700">
          <span id="dateWarnText"></span>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1.5">종류</label>
        <select id="fType" onchange="updateDayChip()"
          class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
          <option value="FULL">종일 (1일)</option>
          <option value="HALF_AM">오전반차 (0.5일)</option>
          <option value="HALF_PM">오후반차 (0.5일)</option>
          <option value="TIME_1H">시간차 1시간 (0.125일)</option>
          <option value="TIME_2H">시간차 2시간 (0.25일)</option>
          <option value="TIME_3H">시간차 3시간 (0.375일)</option>
          <option value="SUPPORT_2H">지원대휴 2시간 (0.25일)</option>
        </select>
        <div id="dayChip" class="mt-2 inline-flex items-center gap-1.5 bg-green-100 text-green-800 rounded-full px-3 py-1 text-xs font-bold">
          <span id="dayChipText">1일 차감</span>
        </div>
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-gray-500 mb-1.5">사유</label>
        <textarea id="fReason" rows="3" placeholder="사유를 입력하세요"
          class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition resize-none"></textarea>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-4">
      <button onclick="submitRequest()"
        class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-sm rounded-xl transition-all">
        신청하기
      </button>
      <span id="formMsg" class="text-sm"></span>
    </div>
  </div>

  <!-- 촉진 통지 알림 -->
  <div id="promoAlert" style="display:none" class="animate-fade-up bg-red-50 border-2 border-red-200 rounded-2xl p-5">
    <div class="flex items-center gap-2 mb-3">
      <span class="text-lg">📋</span>
      <p class="text-sm font-bold text-red-700">연차사용 촉진 통지가 있습니다</p>
    </div>
    <div id="promoAlertList" class="flex flex-col gap-2"></div>
  </div>

  <!-- 내 신청 내역 -->
  <div id="listCard" style="display:none" class="animate-fade-up bg-white rounded-2xl shadow-sm p-5">
    <div class="flex items-center justify-between mb-4">
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">내 신청 내역</p>
      <button id="showAllBtn" onclick="toggleShowAllYears()" style="display:none"
              class="text-xs text-blue-500 hover:text-blue-700 font-semibold transition">
        전체 연도 보기
      </button>
    </div>

    <div id="reqMobile" class="flex flex-col gap-3 sm:hidden"></div>
    <div class="sm:block overflow-x-auto" style="display:none" id="reqDesktop">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b-2 border-gray-100">
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2 pr-3">날짜</th>
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2 pr-3">종류</th>
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2 pr-3">사유</th>
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2 pr-3">상태</th>
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2">메모</th>
            <th class="text-left text-[11px] font-semibold text-gray-500 uppercase tracking-wider pb-2"></th>
          </tr>
        </thead>
        <tbody id="reqBody"></tbody>
      </table>
    </div>
  </div>

  <a href="/admin" class="text-center text-xs text-gray-300 hover:text-blue-400 transition">→ 관리자 페이지</a>
</div>

<script>
  const API  = '/api';
  const CIRC = 2 * Math.PI * 68;

  let selectedEmpId   = null;
  let employees       = [];
  let myRequestCache  = [];
  let showAllYears    = false;

  function ringColor(pct) {
    return pct > .5 ? '#4ade80' : pct > .2 ? '#facc15' : '#f87171';
  }

  // ── 직원 목록 로드 → 드롭다운 ─────────────────────────────────────────────
  async function loadEmployees() {
    employees = await fetch(`${API}/employees`).then(r => r.json());
    const sel = document.getElementById('empSelect');
    sel.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>' +
      employees.map(e =>
        `<option value="${e.id}">${e.name} (잔여 ${e.remainingDays}일)</option>`
      ).join('');
  }

  function onSelectEmp() {
    const id = document.getElementById('empSelect').value;
    if (!id) {
      selectedEmpId = null;
      ['heroCard','formCard','listCard','promoAlert'].forEach(cid => hide(cid));
      return;
    }
    selectEmp(id);
  }

  // ── 직원 선택 ─────────────────────────────────────────────────────────────
  async function selectEmp(id) {
    selectedEmpId  = id;
    myRequestCache = [];
    showAllYears   = false;
    hide('dateWarn');
    document.getElementById('formMsg').textContent = '';
    ['heroCard','formCard','listCard'].forEach(cid => show(cid));
    const emp = employees.find(e => e.id === id);
    if (emp) { updateHero(emp, 0); await loadMyRequests(emp); await loadCalData(); await loadPromotions(id); }
  }

  function updateHero(emp, pendingCount) {
    const pct   = emp.totalDays > 0 ? emp.remainingDays / emp.totalDays : 0;
    const color = ringColor(pct);

    document.getElementById('heroName').textContent = `${emp.name}님의 ${emp.year}년 잔여 연차`;

    const fill = document.getElementById('ringFill');
    fill.style.stroke           = color;
    fill.style.strokeDashoffset = CIRC;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.strokeDashoffset = CIRC * (1 - pct);
    }));

    countUp('ringDays', emp.remainingDays, color);

    document.getElementById('sTot').textContent  = emp.totalDays + '일';
    document.getElementById('sUsed').textContent = emp.usedDays + '일';
    document.getElementById('sRem').textContent  = emp.remainingDays + '일';

    const usedPct = emp.totalDays > 0 ? Math.round((emp.usedDays / emp.totalDays) * 100) : 0;
    document.getElementById('heroSummary').innerHTML =
      `총 <strong>${emp.totalDays}일</strong> 중 <strong>${emp.usedDays}일</strong> 승인 사용 (${usedPct}%)`;

    if (pendingCount > 0) {
      document.getElementById('pendingBadgeText').textContent = `대기중 신청 ${pendingCount}건`;
      show('pendingBadge');
    } else {
      hide('pendingBadge');
    }
  }

  function countUp(elId, target, color) {
    const el = document.getElementById(elId);
    const dur = 600, begin = performance.now();
    el.style.color = color;
    function step(now) {
      const t   = Math.min((now - begin) / dur, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      const cur  = target * ease;
      el.textContent = (Math.round(cur * 2) / 2).toFixed(target % 1 === 0 ? 0 : 1);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = target % 1 === 0 ? target : target.toFixed(1);
    }
    requestAnimationFrame(step);
  }

  // ── 신청 내역 로드 ─────────────────────────────────────────────────────────
  async function loadMyRequests(emp) {
    const yearParam = showAllYears ? '' : `&year=${new Date().getFullYear()}`;
    const list = await fetch(`${API}/requests?employeeId=${emp.id}${yearParam}`).then(r => r.json());
    myRequestCache = list;

    const pendingCount = list.filter(r => r.status === 'PENDING').length;
    updateHero(emp, pendingCount);

    const btn = document.getElementById('showAllBtn');
    btn.style.display = showAllYears ? 'none' : 'block';

    const mobile  = document.getElementById('reqMobile');
    const desktop = document.getElementById('reqDesktop');
    const tbody   = document.getElementById('reqBody');

    if (!list.length) {
      mobile.innerHTML  = `<p class="text-sm text-gray-300 text-center py-4">신청 내역이 없습니다.</p>`;
      tbody.innerHTML   = `<tr><td colspan="6" class="text-center text-gray-300 py-6 text-sm">신청 내역이 없습니다.</td></tr>`;
      desktop.style.display = 'none';
      return;
    }

    // 데스크톱 테이블 보이기
    if (window.innerWidth >= 640) desktop.style.display = 'block';

    mobile.innerHTML = list.map(r => `
      <div class="border border-gray-100 rounded-xl p-4 flex items-start justify-between gap-3">
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-sm text-gray-800">${r.date}</span>
            <span class="${typeBadgeCls(r.type)} px-2 py-0.5 rounded-full text-xs font-semibold">${labelType(r.type)}</span>
          </div>
          <p class="text-xs text-gray-500">${esc(r.reason)}</p>
          ${r.reviewNote ? `<p class="text-xs text-gray-400">${esc(r.reviewNote)}</p>` : ''}
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="${statusBadgeCls(r.status)} px-2.5 py-1 rounded-full text-xs font-bold">${labelStatus(r.status)}</span>
          ${r.status==='APPROVED'?`<a href="${gcalUrl(r)}" target="_blank" class="text-[10px] text-blue-500 hover:text-blue-700">📅 캘린더 추가</a>`:''}
        </div>
      </div>
    `).join('');

    tbody.innerHTML = list.map(r => `
      <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
        <td class="py-3 pr-3 text-sm text-gray-700 whitespace-nowrap">${r.date}</td>
        <td class="py-3 pr-3"><span class="${typeBadgeCls(r.type)} px-2 py-0.5 rounded-full text-xs font-semibold">${labelType(r.type)}</span></td>
        <td class="py-3 pr-3 text-sm text-gray-600 max-w-[140px] truncate">${esc(r.reason)}</td>
        <td class="py-3 pr-3"><span class="${statusBadgeCls(r.status)} px-2.5 py-0.5 rounded-full text-xs font-bold">${labelStatus(r.status)}</span></td>
        <td class="py-3 text-xs text-gray-400">${r.reviewNote ? esc(r.reviewNote) : '—'}</td>
        <td class="py-3 pr-3">${r.status==='APPROVED'?`<a href="${gcalUrl(r)}" target="_blank" class="text-xs text-blue-500 hover:text-blue-700 whitespace-nowrap">📅 캘린더</a>`:''}</td>
      </tr>
    `).join('');
  }

  function toggleShowAllYears() {
    showAllYears = true;
    const emp = employees.find(e => e.id === selectedEmpId);
    if (emp) loadMyRequests(emp);
  }

  // ── 연차 신청 ──────────────────────────────────────────────────────────────
  async function submitRequest() {
    const date   = document.getElementById('fDate').value;
    const type   = document.getElementById('fType').value;
    const reason = document.getElementById('fReason').value.trim();
    const msgEl  = document.getElementById('formMsg');

    if (!date)   { showMsg(msgEl, '날짜를 선택해주세요.', false); return; }
    if (!reason) { showMsg(msgEl, '사유를 입력해주세요.', false); return; }

    const res = await fetch(`${API}/requests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ employeeId: selectedEmpId, date, type, reason }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(msgEl, data.error, false); return; }

    showMsg(msgEl, '신청 완료! 관리자 승인 후 연차가 차감됩니다.', true);
    document.getElementById('fReason').value = '';
    hide('dateWarn');
    myRequestCache = [];
    employees = await fetch(`${API}/employees`).then(r => r.json());

    // 드롭다운 옵션 갱신
    const sel = document.getElementById('empSelect');
    sel.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>' +
      employees.map(e =>
        `<option value="${e.id}" ${e.id === selectedEmpId ? 'selected' : ''}>${e.name} (잔여 ${e.remainingDays}일)</option>`
      ).join('');

    const emp = employees.find(e => e.id === selectedEmpId);
    if (emp) { await loadMyRequests(emp); await loadCalData(); }
  }

  // ── 날짜 중복 체크 ─────────────────────────────────────────────────────────
  async function checkDateConflict() {
    const date = document.getElementById('fDate').value;
    hide('dateWarn');
    if (!date || !selectedEmpId) return;
    if (!myRequestCache.length) {
      myRequestCache = await fetch(`${API}/requests?employeeId=${selectedEmpId}`).then(r => r.json());
    }
    const type = document.getElementById('fType').value;
    const existing = myRequestCache.filter(r => r.date === date && (r.status === 'PENDING' || r.status === 'APPROVED'));
    if (existing.length) {
      const hasFull = existing.some(r => r.type === 'FULL');
      const hasAM = existing.some(r => r.type === 'HALF_AM');
      const hasPM = existing.some(r => r.type === 'HALF_PM');
      let warn = '';
      if (hasFull || type === 'FULL') warn = '이미 신청된 날짜입니다.';
      else if (type === 'HALF_AM' && hasAM) warn = '이미 오전반차가 신청되어 있습니다.';
      else if (type === 'HALF_PM' && hasPM) warn = '이미 오후반차가 신청되어 있습니다.';
      if (warn) {
        document.getElementById('dateWarnText').textContent = warn;
        show('dateWarn');
      }
    }
  }

  const DAYS_MAP = {FULL:1,HALF_AM:0.5,HALF_PM:0.5,TIME_1H:0.125,TIME_2H:0.25,TIME_3H:0.375,SUPPORT_2H:0.25};
  function updateDayChip() {
    const type = document.getElementById('fType').value;
    const days = DAYS_MAP[type] ?? 1;
    document.getElementById('dayChipText').textContent = `${days}일 차감`;
    document.getElementById('dayChip').className = `mt-2 inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-bold
      ${days < 1 ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`;
  }

  // ── 유틸 ───────────────────────────────────────────────────────────────────
  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  function esc(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function labelType(t)   { return { FULL:'종일', HALF_AM:'오전반차', HALF_PM:'오후반차', TIME_1H:'시간차(1h)', TIME_2H:'시간차(2h)', TIME_3H:'시간차(3h)', SUPPORT_2H:'지원대휴(2h)' }[t] ?? t; }
  function labelStatus(s) { return { PENDING:'대기중', APPROVED:'승인', REJECTED:'반려' }[s] ?? s; }
  function statusBadgeCls(s) {
    return { PENDING:'bg-yellow-100 text-yellow-800', APPROVED:'bg-green-100 text-green-800', REJECTED:'bg-red-100 text-red-800' }[s] ?? 'bg-gray-100 text-gray-600';
  }
  function typeBadgeCls(t) {
    return { FULL:'bg-blue-100 text-blue-700', HALF_AM:'bg-orange-100 text-orange-700', HALF_PM:'bg-purple-100 text-purple-700', TIME_1H:'bg-teal-100 text-teal-700', TIME_2H:'bg-teal-100 text-teal-700', TIME_3H:'bg-teal-100 text-teal-700', SUPPORT_2H:'bg-pink-100 text-pink-700' }[t] ?? 'bg-gray-100 text-gray-600';
  }
  function gcalUrl(r) {
    const d = r.date.replace(/-/g,'');
    const next = new Date(r.date); next.setDate(next.getDate()+1);
    const d2 = next.toISOString().slice(0,10).replace(/-/g,'');
    const title = encodeURIComponent(`[연차] ${r.employeeName}`);
    const detail = encodeURIComponent(`${labelType(r.type)} ${r.days}일 · ${r.reason}`);
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${d2}&details=${detail}`;
  }
  function showMsg(el, msg, ok) {
    el.textContent = msg;
    el.className   = `text-sm ${ok ? 'text-green-600' : 'text-red-500'}`;
  }

  // ── 촉진 통지 ──────────────────────────────────────────────────────────────
  async function loadPromotions(empId) {
    const promos = await fetch(`${API}/promotions/${empId}`).then(r=>r.json());
    const unconfirmed = promos.filter(p => !p.confirmedAt);
    const alertEl = document.getElementById('promoAlert');
    const listEl = document.getElementById('promoAlertList');
    if (!unconfirmed.length) { alertEl.style.display = 'none'; return; }
    alertEl.style.display = 'block';
    listEl.innerHTML = unconfirmed.map(p => `
      <div class="bg-white rounded-xl p-4 border border-red-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold ${p.round===1?'text-orange-600':'text-red-600'}">${p.round}차 촉진 (${new Date(p.sentAt).toLocaleDateString('ko-KR')})</span>
        </div>
        <p class="text-xs text-gray-600 mb-3">잔여 연차 <strong>${p.snapshot['잔여연차']||0}일</strong>의 사용을 촉진합니다.</p>
        <button onclick="confirmPromo('${p.id}')" class="w-full py-2 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-bold rounded-lg transition">촉진 통지를 확인했습니다</button>
      </div>
    `).join('');
  }

  async function confirmPromo(promoId) {
    if (!confirm('촉진 통지를 확인하시겠습니까?\n확인 시점이 기록됩니다.')) return;
    const res = await fetch(`${API}/promotions/${promoId}/confirm`, { method: 'PATCH' });
    const data = await res.json();
    if (!res.ok) { alert(data.error); return; }
    alert('확인이 기록되었습니다.');
    if (selectedEmpId) loadPromotions(selectedEmpId);
  }

  // ── 달력 ───────────────────────────────────────────────────────────────────
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth(); // 0-based
  let calRequests = [];

  function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} loadCalData(); }
  function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} loadCalData(); }

  async function loadCalData() {
    // 전체 직원 일정 로드
    calRequests = await fetch(`${API}/requests?year=${calYear}`).then(r=>r.json());
    renderCal();
  }

  function renderCal() {
    document.getElementById('calTitle').textContent = `${calYear}년 ${calMonth+1}월`;
    const grid = document.getElementById('calGrid');
    const first = new Date(calYear, calMonth, 1);
    const lastDay = new Date(calYear, calMonth+1, 0).getDate();
    const startDow = first.getDay();
    const today = new Date().toISOString().slice(0,10);
    const monthStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;

    let html = '';
    for (let i=0; i<startDow; i++) html += '<div class="min-h-[56px]"></div>';

    for (let d=1; d<=lastDay; d++) {
      const dateStr = `${monthStr}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === today;
      const dow = (startDow + d - 1) % 7;
      const dayReqs = calRequests.filter(r => r.date === dateStr && r.status !== 'REJECTED');

      const entries = dayReqs.slice(0,3).map(r => {
        const isPending = r.status === 'PENDING';
        const dotCls = calDotColor(r.type, isPending);
        const isMe = r.employeeId === selectedEmpId;
        return `<div class="flex items-center gap-0.5 truncate ${isMe?'font-bold':''}"><span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${dotCls}"></span><span class="truncate">${esc(r.employeeName)}</span></div>`;
      }).join('');
      const more = dayReqs.length > 3 ? `<div class="text-gray-400">+${dayReqs.length-3}</div>` : '';

      html += `<div class="min-h-[56px] border border-gray-50 rounded-lg p-1 ${isToday?'bg-blue-50 ring-1 ring-blue-300':''} cursor-pointer hover:bg-gray-50 transition" onclick="calClickDate('${dateStr}')">
        <div class="text-[11px] font-semibold mb-0.5 ${dow===0?'text-red-400':dow===6?'text-blue-400':'text-gray-500'}">${d}</div>
        <div class="flex flex-col gap-0.5 text-[9px] text-gray-600 leading-tight">${entries}${more}</div>
      </div>`;
    }
    grid.innerHTML = html;
  }

  function calDotColor(type, isPending) {
    if (isPending) return 'bg-yellow-400 border border-yellow-500';
    const m = {FULL:'bg-blue-500',HALF_AM:'bg-orange-400',HALF_PM:'bg-purple-400',TIME_1H:'bg-teal-500',TIME_2H:'bg-teal-500',TIME_3H:'bg-teal-500',SUPPORT_2H:'bg-pink-500'};
    return m[type] ?? 'bg-gray-400';
  }

  function calClickDate(dateStr) {
    document.getElementById('fDate').value = dateStr;
    checkDateConflict();
  }

  document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
  loadEmployees();
  loadCalData();
</script>
</body>
</html>
